name: Liquibase CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  liquibase-verify:
    name: Verify and Migrate DB with Liquibase
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: neurowatch
          POSTGRES_USER: neurowatch_user
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Process Resources
        shell: bash
        run: |
          ./mvnw process-resources

      - name: Validate changesets
        uses: liquibase-github-actions/validate@v4.27.0
        with:
          changelogFile: db/changelog/db.changelog-master.yaml
          searchPath: src/main/resources
          url: "jdbc:postgresql://postgres:5432/neurowatch"
          username: neurowatch_user
          password: ${{ secrets.DB_PASSWORD }}
          headless: true
          logLevel: INFO

      - name: Preview updateSQL (dry run)
        uses: liquibase-github-actions/update-sql@v4.27.0
        with:
          changelogFile: db/changelog/db.changelog-master.yaml
          searchPath: src/main/resources
          url: "jdbc:postgresql://postgres:5432/neurowatch"
          username: neurowatch_user
          password: ${{ secrets.DB_PASSWORD }}
          headless: true
          logLevel: INFO

      - name: Preview rollbackSQL (dry run of last changeSet)
        uses: liquibase-github-actions/rollback-count-sql@v4.27.0
        with:
          changelogFile: db/changelog/db.changelog-master.yaml
          searchPath: src/main/resources
          count: 1
          url: "jdbc:postgresql://postgres:5432/neurowatch"
          username: neurowatch_user
          password: ${{ secrets.DB_PASSWORD }}
          headless: true
          logLevel: INFO

      - name: Apply Liquibase migration
        uses: liquibase-github-actions/update@v4.27.0
        with:
          changelogFile: db/changelog/db.changelog-master.yaml
          searchPath: src/main/resources
          url: "jdbc:postgresql://postgres:5432/neurowatch"
          username: neurowatch_user
          password: ${{ secrets.DB_PASSWORD }}
          headless: true
          logLevel: INFO

      - name: Run tests
        run: ./mvnw test

      - name: Deploy app
        if: success()
        run: echo "Deploy your app here..."